$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Webform S1'
status: stable
description: 'A heading and a webform in a narrow centred column.'
neo: true
props:
  type: object
  properties:
    heading:
      type: heading
      title: 'Heading'
      examples:
        title: 'Schedule service'
    description:
      type: markup
      title: 'Description'
      examples: '<p>Tell us what you need and we will be in touch.</p>'
    scheme:
      type: scheme
      title: 'Color Scheme'
      apply: true
      examples: primary_solid
slots:
  form:
    title: 'Form'
    description: 'The webform, picked per section.'
